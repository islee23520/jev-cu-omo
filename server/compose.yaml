name: jev-cu-qwen
services:
  ollama:
    image: ollama/ollama:0.32.11@sha256:acc1d61dc30525ecbe11c811462637f474ce9b1c8db80321d1cee81e3ffc7894
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QWEN_PORT:-11436}:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - type: bind
        source: ./docker-data
        target: /root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Opt-in image generation/editing service (official Diffusers
  # QwenImage21Pipeline). Never starts with the default profile, so the
  # ollama rollback path and GPU load stay untouched.
  qwen-image:
    profiles:
      - qwen-image
    build:
      context: ./qwen-image
    image: jev-cu-qwen/qwen-image:2.1-diffusers-6256aa7
    ports:
      - "127.0.0.1:${QWEN_IMAGE_PORT:-11437}:8000"
    environment:
      - HF_HOME=/cache
      - QWEN_IMAGE_OUTPUT_DIR=/output
      - QWEN_IMAGE_OFFLOAD=${QWEN_IMAGE_OFFLOAD:-model}
    volumes:
      - ./qwen-image-data/cache:/cache
      - ./qwen-image-data/output:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
